name: Release

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  vscode-packages:
    name: Build VS Code extension (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: windows-latest
            target: win32-x64
          - os: macos-15-intel
            target: darwin-x64
          - os: macos-latest
            target: darwin-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fail if not running on main branch
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo This workflow must run on main. Current ref: $GITHUB_REF
          exit 1
        env:
          GITHUB_REF: ${{ github.ref }}

      - name: Set up JDK 17 for Maven
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build standalone server JAR
        run: mvn --batch-mode -DskipTests package

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Build VS Code extension package
        working-directory: vscode-extension
        shell: bash
        run: |
          npm ci
          npm run package -- ${{ matrix.target }}

      - name: Upload extension package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vscode-extension-${{ matrix.target }}
          path: vscode-extension/*.vsix

  release:
    runs-on: ubuntu-latest
    needs: vscode-packages
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      OVSX_PAT: ${{ secrets.OPEN_VSX_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fail if not running on main branch
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo This workflow must run on main. Current ref: $GITHUB_REF
          exit 1
        env:
          GITHUB_REF: ${{ github.ref }}

      - name: Set up JDK 17 for Maven
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build standalone server JAR
        run: mvn --batch-mode -DskipTests package

      - name: Set up JDK 17 for Gradle
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build plugin distribution
        working-directory: intellij-plugin
        run: ./gradlew buildPlugin --no-daemon

      - name: Download platform-specific extension packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vscode-extension-*
          path: vscode-extension
          merge-multiple: true

      - name: Create GitHub release
        run: bash ./.github/workflows/github_release.sh
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Set up Node.js
        if: ${{ env.OVSX_PAT != '' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Publish to Open VSX Registry
        if: ${{ env.OVSX_PAT != '' }}
        working-directory: vscode-extension
        run: |
          for package in *.vsix; do
            echo "Publishing $package"
            npx --yes ovsx publish "$package"
          done

